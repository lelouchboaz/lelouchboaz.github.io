<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boaz Lelouch — Liens</title>
<meta name="description" content="Boaz Lelouch — clips, portfolio et contact.">
<meta property="og:type" content="website"><meta property="og:title" content="Boaz Lelouch — Liens"><meta property="og:description" content="Clips, portfolio et contact."><meta property="og:url" content="https://lelouchboaz.github.io/links/"><meta property="og:image" content="https://lelouchboaz.github.io/og.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Inter+Tight:wght@400;500&display=swap">
<style>
:root{--bg:#fafaf8;--ink:#111;--mute:#8a8a85;--line:#1112;--ui:'Inter Tight','Helvetica Neue',Arial,sans-serif;--didone:'Bodoni Moda',Didot,'Times New Roman',serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0b;--ink:#f1f0ec;--mute:#78776f;--line:#f1f0ec26}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:400 12px/1.6 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:max(48px,env(safe-area-inset-top)) 22px max(40px,env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
main{max-width:480px;margin:0 auto}
.logo{width:64px;height:auto;display:block;margin:0 auto 26px}
@media(prefers-color-scheme:dark){.logo{filter:invert(1)}}
h1{margin:0;text-align:center;font:400 clamp(44px,14vw,64px)/.9 var(--didone);letter-spacing:-.03em;text-transform:none}h1 i{display:block}
.sub{text-align:center;color:var(--mute);margin:18px 0 44px;letter-spacing:.14em}
h2{font:500 10px var(--ui);letter-spacing:.18em;color:var(--mute);margin:40px 0 12px}
.l{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;margin-bottom:10px;border:1px solid var(--ink);transition:background .3s,color .3s}
.l:hover,.l:active{background:var(--ink);color:var(--bg)}
.l b{display:block;font:italic 400 24px/1.05 var(--didone);letter-spacing:-.02em;text-transform:none}.l small{display:block;margin-top:4px;font:500 10px var(--ui);letter-spacing:.16em;color:var(--mute)}.l:hover small{color:inherit;opacity:.7}
.l span{font-size:18px;margin-left:auto}.l.ci{padding:10px 18px 10px 10px}.l img{width:64px;height:64px;object-fit:cover;flex:none}.l.wide{flex-wrap:wrap;padding:0}.l.wide img.w{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;display:block}.l.wide .tx{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 20px}
.main{background:var(--ink);color:var(--bg)}.main:hover{background:transparent;color:var(--ink)}.main small{color:inherit;opacity:.7}
footer{text-align:center;color:var(--mute);margin-top:48px}
</style></head><body><main>
<img class="logo" src="../favicon.png" alt="BL">
<h1>Boaz<i>Lelouch</i></h1>
<p class="sub">Réalisateur · Photographe · Paris</p>
<div id="ls"></div>
<footer>© 2026 Boaz Lelouch</footer>
</main>
<script>
/* ===== Modifier ici : titre, sous-titre, lien. type "main" = bouton plein. ===== */
const BASE="https://lelouchboaz.github.io/";
const LINKS=[
 {h:null,items:[
  {t:"Mon site",s:"Portfolio complet",u:BASE,main:1,wide:"img/site.jpg"},
  {t:"Portfolio en PDF",s:"Télécharger",u:BASE+"pdf/portfolio.pdf"}
 ]},
 {h:"Clips",items:[
  {t:"Comme d’hab",s:"Cherki · 2024",u:BASE+"#projet=Comme%20d%E2%80%99hab",img:"img/comme-dhab.jpg"},
  {t:"Ce que j’ai à perdre",s:"Clip",u:BASE+"#projet=Ce%20que%20j%E2%80%99ai%20%C3%A0%20perdre",img:"img/ce-que.jpg"},
  {t:"Osterbo",s:"Clip",u:BASE+"#projet=Osterbo",img:"img/osterbo.jpg"}
 ]},
 {h:"Suivre / contact",items:[
  {t:"Instagram",s:"@boaz_lch",u:"https://www.instagram.com/boaz_lch/"},
  {t:"Écrire un e-mail",s:"lelouchboaz@gmail.com",u:"mailto:lelouchboaz@gmail.com"}
 ]}
];
const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById('ls').innerHTML=LINKS.map(g=>(g.h?`<h2>${E(g.h)}</h2>`:'')+g.items.map(l=>{const ext=/^https?:/.test(l.u)&&!l.u.startsWith(BASE)?' target="_blank" rel="noopener"':'';const tx=`<div><b>${E(l.t)}</b>${l.s?`<small>${E(l.s)}</small>`:''}</div><span>↗</span>`;if(l.wide)return `<a class="l main wide" href="${l.u}"${ext}><img class="w" src="${l.wide}" alt="">${'<div class="tx">'+tx+'</div>'}</a>`;return `<a class="l${l.img?' ci':''}" href="${l.u}"${ext}>${l.img?`<img src="${l.img}" alt="">`:''}${tx}</a>`}).join('')).join('');
</script></body></html>
